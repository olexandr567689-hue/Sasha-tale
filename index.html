<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS2 Mobile Web</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; color: white; touch-action: none; }
        
        /* Адаптивне меню */
        #ui-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); z-index: 20; padding: 10px; }
        .window { background: #232730; padding: 20px; border-radius: 15px; border: 2px solid #d89b00; width: 90%; max-width: 400px; text-align: center; }
        
        input { width: 80%; padding: 15px; margin: 10px 0; border-radius: 8px; border: none; font-size: 18px; }
        button { background: #d89b00; color: white; border: none; padding: 15px; margin: 5px; cursor: pointer; font-weight: bold; border-radius: 8px; width: 100%; font-size: 16px; }

        /* HUD для телефону */
        #game-hud { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; display: none; }
        .stat { background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; margin-bottom: 5px; font-size: 14px; }

        /* Сенсорне керування */
        #controls { position: absolute; inset: 0; display: none; z-index: 5; }
        .joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; }
        .fire-btn { position: absolute; bottom: 40px; right: 20px; width: 80px; height: 80px; background: rgba(255,0,0,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid red; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid #0f0; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; display: none; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div id="auth-window" class="window">
            <h2>CS2 MOBILE</h2>
            <input type="text" id="username" placeholder="Нікнейм">
            <button onclick="login()">ГРАТИ</button>
        </div>

        <div id="main-menu" class="window hidden">
            <h3 id="welcome-text">Привіт!</h3>
            <p>Баланс: $<span id="user-balance">1000</span></p>
            <button onclick="startGame()" style="background: #4CAF50;">У БІЙ (3D)</button>
            <button onclick="toggleWindow('case-window')">КЕЙСИ</button>
            <button onclick="toggleWindow('shop-window')">МАГАЗИН</button>
        </div>

        <div id="case-window" class="window hidden">
            <h3>КЕЙСИ</h3>
            <button onclick="openCase()">ВІДКРИТИ ($250)</button>
            <div id="inv-display" style="font-size: 12px; margin: 10px 0;"></div>
            <button onclick="toggleWindow('main-menu')" style="background: #555;">НАЗАД</button>
        </div>

        <div id="shop-window" class="window hidden">
            <h3>МАГАЗИН</h3>
            <button onclick="buyWeapon('AK-47', 2700)">AK-47 ($2700)</button>
            <button onclick="buyWeapon('Deagle', 700)">Deagle ($700)</button>
            <button onclick="toggleWindow('main-menu')" style="background: #555;">НАЗАД</button>
        </div>
    </div>

    <div id="game-hud">
        <div class="stat">HP: 100</div>
        <div class="stat">Зброя: <span id="cur-wpn">Ніж</span></div>
        <div class="stat">$: <span id="cur-cash">1000</span></div>
    </div>

    <div id="crosshair"></div>

    <div id="controls">
        <div class="joystick-zone" id="touch-move"></div>
        <div class="fire-btn" id="touch-fire">FIRE</div>
        <button onclick="stopGame()" style="position: absolute; top: 10px; right: 10px; width: auto; padding: 5px 15px; background: rgba(0,0,0,0.5);">X</button>
    </div>

    <script>
        let userData = { name: "", balance: 1000, inventory: [], currentWeapon: "Ніж" };
        let scene, camera, renderer, bot;
        let isPlaying = false;

        // Авторизація та збереження
        function login() {
            const name = document.getElementById('username').value;
            if (!name) return;
            const saved = localStorage.getItem('cs_mobile_' + name);
            userData = saved ? JSON.parse(saved) : { ...userData, name };
            document.getElementById('welcome-text').innerText = "Боєць: " + userData.name;
            updateUI();
            toggleWindow('main-menu');
        }

        function updateUI() {
            document.getElementById('user-balance').innerText = userData.balance;
            document.getElementById('cur-cash').innerText = userData.balance;
            document.getElementById('cur-wpn').innerText = userData.currentWeapon;
            document.getElementById('inv-display').innerText = "Інвентар: " + (userData.inventory.join(", ") || "порожньо");
            localStorage.setItem('cs_mobile_' + userData.name, JSON.stringify(userData));
        }

        function toggleWindow(id) {
            document.querySelectorAll('.window').forEach(w => w.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function openCase() {
            if (userData.balance >= 250) {
                userData.balance -= 250;
                const items = ["AK-47 | Neon", "Glock | Water", "Knife | Gold"];
                userData.inventory.push(items[Math.floor(Math.random()*items.length)]);
                updateUI();
            }
        }

        function buyWeapon(name, price) {
            if (userData.balance >= price) {
                userData.balance -= price;
                userData.currentWeapon = name;
                updateUI();
                alert("Взяв " + name);
            }
        }

        // 3D Частина
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x333333);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
            scene.add(light);

            // Бот
            bot = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshStandardMaterial({color: 0xff0000}));
            bot.position.set(0, 1, -10);
            scene.add(bot);

            // Підлога
            const grid = new THREE.GridHelper(100, 20);
            scene.add(grid);

            camera.position.y = 1.6;
        }

        function startGame() {
            if (!scene) init3D();
            isPlaying = true;
            document.getElementById('ui-overlay').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';
            document.getElementById('controls').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            animate();
        }

        function stopGame() {
            isPlaying = false;
            document.getElementById('ui-overlay').style.display = 'flex';
            document.getElementById('game-hud').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            document.getElementById('crosshair').style.display = 'none';
        }

        function animate() {
            if (!isPlaying) return;
            requestAnimationFrame(animate);
            bot.position.x = Math.sin(Date.now() * 0.001) * 3;
            renderer.render(scene, camera);
        }

        // Керування стрільбою для телефону
        document.getElementById('touch-fire').addEventListener('touchstart', (e) => {
            e.preventDefault();
            // Тут буде логіка пострілу
            bot.material.color.set(0xffff00);
            setTimeout(() => bot.material.color.set(0xff0000), 100);
        });

        // Адаптація під поворот екрану
        window.addEventListener('resize', () => {
            if (camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
