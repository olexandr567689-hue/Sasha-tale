<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>CS2 Web Ultimate - Sasha Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; background: #000; color: white; }
        
        /* Інтерфейс меню */
        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); z-index: 10; }
        .window { background: #232730; padding: 30px; border-radius: 10px; border: 1px solid #d89b00; text-align: center; min-width: 300px; }
        
        /* Кнопки */
        button { background: #d89b00; color: white; border: none; padding: 12px 20px; margin: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; border-radius: 4px; }
        button:hover { background: #ffb800; }
        button:disabled { background: #555; }

        /* Ігрові показники */
        #game-hud { position: absolute; bottom: 20px; left: 20px; display: none; z-index: 5; pointer-events: none; }
        .stat-box { background: rgba(0,0,0,0.6); padding: 10px 20px; margin-bottom: 5px; border-left: 5px solid #d89b00; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid #0f0; border-radius: 50%; transform: translate(-50%, -50%); display: none; }

        /* Магазин та Кейси */
        .hidden { display: none !important; }
        .inventory-list { text-align: left; max-height: 100px; overflow-y: auto; background: #111; padding: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div id="auth-window" class="window">
            <h1>CS2 WEB PROJECT</h1>
            <input type="text" id="username" placeholder="Твій нікнейм" style="padding: 10px; width: 80%;"><br>
            <button onclick="login()">Увійти в аккаунт</button>
        </div>

        <div id="main-menu" class="window hidden">
            <h2 id="welcome-text">Привіт, Боєць!</h2>
            <p>Баланс: <span id="user-balance">1000</span>$</p>
            <button onclick="startGame('sp')" style="background: #4CAF50;">Одиночний режим</button>
            <button onclick="alert('Підключення до серверів GitHub...')">Мультиплеєр (Beta)</button>
            <button onclick="toggleWindow('case-window')">Кейси</button>
            <button onclick="toggleWindow('shop-window')">Закупка (Магазин)</button>
        </div>

        <div id="case-window" class="window hidden">
            <h2>Кейс "Revolution"</h2>
            <p>Ціна: $250</p>
            <button onclick="openCase()">Відкрити</button>
            <div class="inventory-list" id="inv-display">Твій інвентар порожній</div>
            <button onclick="toggleWindow('main-menu')" style="background: #666;">Назад</button>
        </div>

        <div id="shop-window" class="window hidden">
            <h2>Закупка зброї</h2>
            <button onclick="buyWeapon('AK-47', 2700)">AK-47 ($2700)</button>
            <button onclick="buyWeapon('AWP', 4750)">AWP ($4750)</button>
            <button onclick="buyWeapon('Deagle', 700)">Deagle ($700)</button>
            <br>
            <button onclick="toggleWindow('main-menu')" style="background: #666;">Назад</button>
        </div>
    </div>

    <div id="game-hud">
        <div class="stat-box">Здоров'я: 100</div>
        <div class="stat-box">Зброя: <span id="current-weapon">Ніж</span></div>
        <div class="stat-box">Гроші: <span id="hud-money">0</span>$</div>
        <button onclick="stopGame()" style="pointer-events: auto;">Вийти (ESC)</button>
    </div>
    <div id="crosshair"></div>

    <script>
        // ДАНІ ГРАВЦЯ
        let userData = {
            name: "",
            balance: 1000,
            inventory: [],
            currentWeapon: "Ніж"
        };

        // 3D ЗМІННІ
        let scene, camera, renderer, bot;
        let isPlaying = false;

        // ЛОГІКА АККАУНТА
        function login() {
            const name = document.getElementById('username').value;
            if (name.length < 2) return alert("Введи нормальне ім'я!");
            
            // Завантаження з пам'яті (якщо є)
            const saved = localStorage.getItem('cs2_user_' + name);
            if (saved) {
                userData = JSON.parse(saved);
            } else {
                userData.name = name;
                saveData();
            }

            document.getElementById('welcome-text').innerText = "Привіт, " + userData.name;
            document.getElementById('user-balance').innerText = userData.balance;
            toggleWindow('main-menu');
            updateInventoryUI();
        }

        function saveData() {
            localStorage.setItem('cs2_user_' + userData.name, JSON.stringify(userData));
        }

        function toggleWindow(id) {
            document.querySelectorAll('.window').forEach(w => w.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // КЕЙСИ
        const skins = ["M4A4 | Temukau", "AK-47 | Vulcan", "Knife | Doppler", "USP-S | Printstream"];
        function openCase() {
            if (userData.balance >= 250) {
                userData.balance -= 250;
                let skin = skins[Math.floor(Math.random() * skins.length)];
                userData.inventory.push(skin);
                alert("Випало: " + skin);
                saveData();
                updateInventoryUI();
                document.getElementById('user-balance').innerText = userData.balance;
            } else {
                alert("Мало грошей!");
            }
        }

        function updateInventoryUI() {
            const display = document.getElementById('inv-display');
            display.innerText = userData.inventory.length > 0 ? userData.inventory.join(", ") : "Порожньо";
        }

        // МАГАЗИН
        function buyWeapon(name, price) {
            if (userData.balance >= price) {
                userData.balance -= price;
                userData.currentWeapon = name;
                alert("Куплено: " + name);
                saveData();
                document.getElementById('user-balance').innerText = userData.balance;
                document.getElementById('current-weapon').innerText = name;
            } else {
                alert("Грошей нема, але ви тримайтесь!");
            }
        }

        // 3D ГРА (THREE.JS)
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Блакитне небо

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Підлога
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({color: 0x555555});
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            // Світло
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(5, 10, 7);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            // Бот (складений з блоків)
            bot = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.5), new THREE.MeshStandardMaterial({color: 0x0000ff}));
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshStandardMaterial({color: 0xffdbac}));
            head.position.y = 1;
            bot.add(body); bot.add(head);
            bot.position.set(0, 0.75, -10);
            scene.add(bot);

            camera.position.y = 1.6; // Ріст гравця
        }

        function startGame(mode) {
            isPlaying = true;
            document.getElementById('ui-overlay').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('hud-money').innerText = userData.balance;
            document.getElementById('current-weapon').innerText = userData.currentWeapon;
            
            if (!scene) init3D();
            animate();
        }

        function stopGame() {
            isPlaying = false;
            document.getElementById('ui-overlay').style.display = 'flex';
            document.getElementById('game-hud').style.display = 'none';
            document.getElementById('crosshair').style.display = 'none';
            toggleWindow('main-menu');
        }

        function animate() {
            if (!isPlaying) return;
            requestAnimationFrame(animate);
            
            // Бот трохи рухається
            bot.position.x = Math.sin(Date.now() * 0.002) * 5;
            
            renderer.render(scene, camera);
        }

        // Постріл
        window.addEventListener('mousedown', () => {
            if (!isPlaying) return;
            // Тут можна додати логіку влучання (Raycaster), як у попередньому коді
            console.log("Постріл з " + userData.currentWeapon);
        });

    </script>
</body>
</html>
