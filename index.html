<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undertale Napstablook: Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
        body { background: #000; color: #fff; margin: 0; font-family: 'DotGothic16', sans-serif; overflow: hidden; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { border: 4px solid #fff; background: #000; max-width: 95vw; max-height: 50vh; cursor: crosshair; }
        #ui { width: 320px; margin-top: 10px; }
        .stats { font-size: 18px; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .hp-bar { width: 100px; height: 15px; background: red; border: 2px solid #fff; position: relative; }
        .hp-fill { height: 100%; background: #ffff00; transition: width 0.3s; }
        #menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 320px; margin-top: 15px; }
        .btn { border: 2px solid #ffa500; color: #ffa500; padding: 10px; text-align: center; cursor: pointer; user-select: none; }
        .btn.active { background: #fff; color: #000; border-color: #fff; }
        #dialog-box { width: 300px; height: 80px; border: 4px solid #fff; padding: 10px; margin-top: 10px; font-size: 16px; position: relative; overflow: hidden; }
        #start-screen { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        button#start { background: none; border: 3px solid #fff; color: #fff; padding: 20px 40px; font-family: inherit; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

<div id="start-screen">
    <div style="font-size: 60px; margin-bottom: 20px;">👻</div>
    <button id="start">ПОЧАТИ БІЙ</button>
</div>

<div id="boss-sprite" style="font-size: 70px; margin-bottom: 10px; transition: 0.5s;">👻</div>

<canvas id="game"></canvas>

<div id="ui">
    <div class="stats">
        <span>SASHA LV 19</span>
        <div style="display:flex; align-items:center;">HP <div class="hp-bar"><div id="hp-f" class="hp-fill"></div></div></div>
        <span id="hp-t">20/20</span>
    </div>
    <div id="dialog-box">* Напстаблук виглядає сором'язливим.</div>
    <div id="menu">
        <div class="btn active" id="b0">БИТВА</div>
        <div class="btn" id="b1">ДІЯ</div>
        <div class="btn" id="b2">ПРЕДМЕТ</div>
        <div class="btn" id="b3">ПОЩАДА</div>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hpF = document.getElementById('hp-f');
const hpT = document.getElementById('hp-t');
const diag = document.getElementById('dialog-box');

let width = 320, height = 160;
canvas.width = width; canvas.height = height;

let state = 'MENU'; // MENU, ATTACKING, DODGING, DIALOG
let menuIdx = 0;
let hp = 20, eHp = 100;
let player = { x: 160, y: 80, size: 12 };
let bullets = [];
let audio;

// --- AUDIO ---
function initAudio() {
    audio = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(f, d, t='square', v=0.05) {
    if(!audio) return;
    let o = audio.createOscillator(); let g = audio.createGain();
    o.type = t; o.frequency.value = f; g.gain.value = v;
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + d);
}

// --- LOGIC ---
function typeWriter(txt) {
    diag.innerHTML = ""; let i = 0;
    let timer = setInterval(() => {
        if(i < txt.length) { diag.innerHTML += txt[i++]; beep(150, 0.05, 'sine'); }
        else clearInterval(timer);
    }, 30);
}

function startEnemyTurn() {
    state = 'DODGING';
    bullets = [];
    let turnTimer = 0;
    let turnInterval = setInterval(() => {
        if(state !== 'DODGING') { clearInterval(turnInterval); return; }
        turnTimer++;
        
        // Різні типи атак кожні 2 секунди
        if(turnTimer % 10 === 0) {
            let pattern = Math.floor(Math.random() * 3);
            if(pattern === 0) { // Злива сліз
                bullets.push({x: Math.random()*width, y: -10, vx: 0, vy: 3, s: 5});
            } else if(pattern === 1) { // Спіраль
                let ang = turnTimer * 0.5;
                bullets.push({x: 160, y: 80, vx: Math.cos(ang)*2, vy: Math.sin(ang)*2, s: 4});
            } else { // Бокові атаки
                bullets.push({x: -10, y: Math.random()*height, vx: 2.5, vy: 0, s: 6});
            }
        }

        if(turnTimer > 80) { // Кінець ходу ворога
            clearInterval(turnInterval);
            state = 'MENU';
            typeWriter("* Напстаблук зітхає...");
        }
    }, 100);
}

function handleInput(tx, ty) {
    let rect = canvas.getBoundingClientRect();
    let sx = width / rect.width;
    let sy = height / rect.height;
    player.x = (tx - rect.left) * sx;
    player.y = (ty - rect.top) * sy;
}

// Керування
canvas.addEventListener('touchmove', e => { e.preventDefault(); handleInput(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
canvas.addEventListener('mousemove', e => { if(e.buttons) handleInput(e.clientX, e.clientY); });

window.addEventListener('keydown', e => {
    if(state === 'MENU') {
        if(e.key === 'ArrowLeft') menuIdx = (menuIdx + 3) % 4;
        if(e.key === 'ArrowRight') menuIdx = (menuIdx + 1) % 4;
        if(e.key.toLowerCase() === 'z') selectMenu();
        updateMenuUI();
    }
});

function updateMenuUI() {
    document.querySelectorAll('.btn').forEach((b, i) => b.classList.toggle('active', i === menuIdx));
}

document.querySelectorAll('.btn').forEach((b, i) => {
    b.onclick = () => { menuIdx = i; selectMenu(); };
});

function selectMenu() {
    if(state !== 'MENU') return;
    beep(400, 0.1);
    if(menuIdx === 0) { // Бій
        typeWriter("* Твій удар... (Miss!)");
        setTimeout(startEnemyTurn, 1500);
    } else if(menuIdx === 1) { // Дія
        typeWriter("* Ти підбадьорив Напстаблука. Він трохи посміхнувся.");
        setTimeout(startEnemyTurn, 2000);
    } else if(menuIdx === 3) { // Пощада
        typeWriter("* Ви перемогли Напстаблука (Мирно)!");
        setTimeout(() => location.reload(), 3000);
    } else {
        typeWriter("* Ти з'їв сендвіч. +0 HP.");
        setTimeout(startEnemyTurn, 1500);
    }
}

// --- GAME LOOP ---
function draw() {
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, width, height);

    if(state === 'DODGING') {
        // Малюємо серце
        ctx.fillStyle = 'red';
        ctx.beginPath();
        let {x, y, size} = player;
        ctx.moveTo(x, y);
        ctx.bezierCurveTo(x-size, y-size, x-size, y+size, x, y+size);
        ctx.bezierCurveTo(x+size, y+size, x+size, y-size, x, y);
        ctx.fill();

        // Малюємо і перевіряємо кулі
        ctx.fillStyle = 'white';
        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            ctx.beginPath(); ctx.arc(b.x, b.y, b.s, 0, Math.PI*2); ctx.fill();

            // Колізія
            let d = Math.hypot(player.x - b.x, player.y - b.y);
            if(d < player.size) {
                hp = Math.max(0, hp - 0.5);
                hpF.style.width = (hp/20*100)+'%';
                hpT.innerText = Math.ceil(hp)+'/20';
                beep(50, 0.1, 'sawtooth', 0.1);
                if(hp <= 0) location.reload();
            }
        });
    }

    requestAnimationFrame(draw);
}

document.getElementById('start').onclick = () => {
    initAudio();
    document.getElementById('start-screen').style.display = 'none';
    typeWriter("* Напстаблук загороджує шлях!");
    draw();
};
</script>
</body>
</html>
