<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS2 Web: Arena Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        
        /* МЕНЮ ТА РЕЄСТРАЦІЯ */
        #ui-layer { position: absolute; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); }
        .menu-card { background: #1a1d23; border: 2px solid #d89b00; border-radius: 15px; padding: 25px; width: 85%; max-width: 350px; text-align: center; color: white; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        button { background: #d89b00; color: white; border: none; padding: 12px; margin: 5px 0; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; }
        
        /* ІГРОВИЙ ІНТЕРФЕЙС (HUD) */
        #hud { position: absolute; top: 10px; left: 10px; z-index: 10; color: white; display: none; pointer-events: none; }
        .stat { background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 4px; margin-bottom: 4px; border-left: 3px solid #d89b00; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; border: 2px solid #0f0; border-radius: 50%; transform: translate(-50%, -50%); display: none; z-index: 50; }

        /* МОБІЛЬНЕ КЕРУВАННЯ */
        #touch-controls { position: absolute; inset: 0; display: none; z-index: 20; }
        .fire-zone { position: absolute; bottom: 40px; right: 30px; width: 80px; height: 80px; background: rgba(255,0,0,0.3); border: 3px solid red; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .move-zone { position: absolute; bottom: 40px; left: 30px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px dashed #aaa; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="auth-box" class="menu-card">
            <h2>CS2 WEB ARENA</h2>
            <input type="text" id="nick" placeholder="Введіть нікнейм">
            <button onclick="app.login()">УВІЙТИ</button>
        </div>

        <div id="menu-box" class="menu-card hidden">
            <h3 id="user-tag">Боєць</h3>
            <p>Баланс: <span id="balance">1000</span>$</p>
            <button onclick="app.start()" style="background: #28a745;">ГРАТИ НА КАРТІ</button>
            <button onclick="app.openCase()">ВІДКРИТИ КЕЙС (250$)</button>
            <button onclick="app.buyWeapon('AK-47', 2700)">КУПИТИ AK-47 (2700$)</button>
            <p style="font-size: 10px;" id="inventory">Інвентар: порожньо</p>
        </div>
    </div>

    <div id="hud">
        <div class="stat">HP: 100</div>
        <div class="stat">Гроші: <span id="hud-money">1000</span>$</div>
        <div class="stat">Зброя: <span id="hud-weapon">Ніж</span></div>
    </div>
    <div id="crosshair"></div>

    <div id="touch-controls">
        <div class="move-zone"></div>
        <div class="fire-zone" id="btn-fire">FIRE</div>
        <button onclick="location.reload()" style="position:absolute; top:10px; right:10px; width:40px;">X</button>
    </div>

    <script>
        const app = {
            data: { name: "", balance: 1000, inventory: [], weapon: "Ніж" },
            scene: null, camera: null, renderer: null, bots: [],
            
            login() {
                const n = document.getElementById('nick').value;
                if(!n) return;
                const saved = localStorage.getItem('cs_v3_'+n);
                this.data = saved ? JSON.parse(saved) : {...this.data, name: n};
                this.updateUI();
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('menu-box').classList.remove('hidden');
            },

            updateUI() {
                document.getElementById('user-tag').innerText = "Гравець: " + this.data.name;
                document.getElementById('balance').innerText = this.data.balance;
                document.getElementById('hud-money').innerText = this.data.balance;
                document.getElementById('hud-weapon').innerText = this.data.weapon;
                document.getElementById('inventory').innerText = "Скіни: " + (this.data.inventory.join(", ") || "немає");
                localStorage.setItem('cs_v3_'+this.data.name, JSON.stringify(this.data));
            },

            openCase() {
                if(this.data.balance >= 250) {
                    this.data.balance -= 250;
                    const skins = ["AK-47 | Asimov", "M4A1 | Hyper Beast", "Karambit | Tiger"];
                    this.data.inventory.push(skins[Math.floor(Math.random()*skins.length)]);
                    this.updateUI();
                }
            },

            buyWeapon(name, price) {
                if(this.data.balance >= price) {
                    this.data.balance -= price;
                    this.data.weapon = name;
                    this.updateUI();
                }
            },

            initMap() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x87ceeb);
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(this.renderer.domElement);

                // Підлога (Карта)
                const ground = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshStandardMaterial({color: 0x333333}));
                ground.rotation.x = -Math.PI/2;
                this.scene.add(ground);

                // Перешкоди (Ящики)
                for(let i=0; i<10; i++) {
                    const box = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0x8B4513}));
                    box.position.set(Math.random()*30-15, 1, Math.random()*30-15);
                    this.scene.add(box);
                }

                // Світло
                const sun = new THREE.DirectionalLight(0xffffff, 1);
                sun.position.set(5, 10, 5);
                this.scene.add(sun);
                this.scene.add(new THREE.AmbientLight(0x404040));

                // Створення ботів (імітація гравців)
                for(let i=0; i<3; i++) this.spawnBot();

                this.camera.position.y = 1.7;
            },

            spawnBot() {
                const bot = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.5), new THREE.MeshStandardMaterial({color: 0xff0000}));
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({color: 0xffdbac}));
                head.position.y = 1;
                bot.add(body); bot.add(head);
                bot.position.set(Math.random()*20-10, 0.8, -Math.random()*20);
                this.scene.add(bot);
                this.bots.push({obj: bot, dir: Math.random() * Math.PI * 2});
            },

            start() {
                document.getElementById('ui-layer').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                document.getElementById('crosshair').style.display = 'block';
                document.getElementById('touch-controls').style.display = 'block';
                if(!this.scene) this.initMap();
                this.animate();
            },

            animate() {
                requestAnimationFrame(() => this.animate());
                
                // Простий рух ботів
                this.bots.forEach(b => {
                    b.obj.position.x += Math.cos(b.dir) * 0.03;
                    b.obj.position.z += Math.sin(b.dir) * 0.03;
                    if(Math.abs(b.obj.position.x) > 20) b.dir += Math.PI;
                });

                this.renderer.render(this.scene, this.camera);
            }
        };

        // Обробка стрільби
        document.getElementById('btn-fire').addEventListener('touchstart', (e) => {
            e.preventDefault();
            // Візуальний ефект пострілу
            document.getElementById('crosshair').style.borderColor = 'red';
            setTimeout(() => document.getElementById('crosshair').style.borderColor = '#0f0', 100);
        });

        // Огляд пальцем (права частина екрану)
        let lastTouchX = 0;
        window.addEventListener('touchmove', (e) => {
            let touch = e.touches[0];
            if(touch.clientX > window.innerWidth / 2) {
                let movementX = touch.clientX - lastTouchX;
                if(app.camera) app.camera.rotation.y -= movementX * 0.005;
            }
            lastTouchX = touch.clientX;
        });
    </script>
</body>
</html>
