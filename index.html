<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS2 Web: Global Arena</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --cs-orange: #f2a900; --dark: #0f1115; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Ubuntu', sans-serif; color: white; touch-action: none; }

        /* ГОЛОВНЕ МЕНЮ (Modern UI) */
        #main-menu { position: absolute; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1c23 0%, #08090a 100%); }
        .ui-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); padding: 40px; border-radius: 24px; border: 1px solid rgba(242, 169, 0, 0.4); text-align: center; width: 340px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        
        button { background: var(--cs-orange); color: #000; border: none; padding: 16px; margin: 10px 0; width: 100%; border-radius: 12px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        button:active { transform: scale(0.95); }
        .btn-sec { background: #2a2d36; color: white; }

        /* КЕЙС-РУЛЕТКА */
        #case-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .roulette-box { width: 320px; height: 100px; border: 2px solid var(--cs-orange); overflow: hidden; position: relative; background: #121417; border-radius: 10px; margin: 20px 0; }
        #roulette-strip { display: flex; position: absolute; left: 0; transition: all 4s cubic-bezier(0.1, 0, 0.1, 1); }
        .item-skin { min-width: 100px; height: 100px; border-right: 1px solid #222; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }

        /* ІГРОВИЙ ЕКРАН */
        #game-hud { position: absolute; bottom: 30px; left: 30px; z-index: 50; display: none; pointer-events: none; }
        .hud-item { background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid var(--cs-orange); font-size: 18px; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); border: 2px solid #00ff00; border-radius: 50%; z-index: 50; display: none; }

        /* МОБІЛЬНЕ КЕРУВАННЯ */
        #mobile-controls { position: absolute; inset: 0; display: none; z-index: 60; }
        .joy-area { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; }
        .btn-fire { position: absolute; bottom: 60px; right: 50px; width: 90px; height: 90px; background: rgba(242, 169, 0, 0.3); border: 4px solid var(--cs-orange); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: white; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="main-menu">
        <div class="ui-card">
            <h1 style="color: var(--cs-orange); margin-bottom: 5px;">CS2 WEB</h1>
            <p style="opacity: 0.6; margin-bottom: 30px;">Multiplayer Edition</p>
            
            <button onclick="core.start('mp')">ГРАТИ МУЛЬТИПЛЕЄР</button>
            <button onclick="core.start('sp')" class="btn-sec">ОДИНОЧНИЙ РЕЖИМ</button>
            <button onclick="core.toggleUI('case-ui', true)" class="btn-sec">ВІДКРИТИ КЕЙС</button>
            <button onclick="core.openShop()" class="btn-sec">МАГАЗИН (BUY)</button>
        </div>
    </div>

    <div id="case-ui">
        <h2>КЕЙС "REVOLUTION"</h2>
        <div class="roulette-box">
            <div style="position: absolute; left: 50%; top:0; width:2px; height:100%; background: red; z-index: 5;"></div>
            <div id="roulette-strip"></div>
        </div>
        <button onclick="core.spinCase()" style="width: 200px;">ВІДКРИТИ ($250)</button>
        <button onclick="core.toggleUI('case-ui', false)" class="btn-sec" style="width: 200px;">НАЗАД</button>
    </div>

    <div id="game-hud">
        <div class="hud-item">HP: <span id="hp">100</span></div>
        <div class="hud-item">MONEY: $<span id="cash">1000</span></div>
        <div class="hud-item">WEAPON: <span id="wpn-name">Knife</span></div>
    </div>
    
    <div id="crosshair"></div>

    <div id="mobile-controls">
        <div class="joy-area" id="joy-move"></div>
        <div class="btn-fire" id="fire-tap">FIRE</div>
        <button onclick="location.reload()" style="position: absolute; top: 20px; right: 20px; width: 50px; padding: 10px;">X</button>
    </div>

    <script>
        // СЕРЦЕ ГРИ
        const core = {
            state: { name: "Sasha", hp: 100, cash: 1000, weapon: "Knife", inventory: [] },
            scene: null, camera: null, renderer: null, socket: null,
            players: {}, bots: [], isMoving: false,

            toggleUI(id, show) {
                document.getElementById(id).style.display = show ? 'flex' : 'none';
            },

            // ЛОГІКА МУЛЬТИПЛЕЄРА (SOCKET.IO)
            initSocket() {
                // Тут вказується посилання на твій майбутній сервер
                this.socket = io("https://your-server-url.com"); 
                
                this.socket.on("playerConnect", (data) => {
                    this.createOtherPlayer(data.id, data.pos);
                });

                this.socket.on("playerMove", (data) => {
                    if(this.players[data.id]) this.players[data.id].position.copy(data.pos);
                });
            },

            // МАГАЗИН
            openShop() {
                const choice = prompt("Виберіть зброю: 1. AK-47 ($2700), 2. AWP ($4750), 3. Deagle ($700)");
                if(choice == "1" && this.state.cash >= 2700) { this.state.weapon = "AK-47"; this.state.cash -= 2700; }
                else if(choice == "2" && this.state.cash >= 4750) { this.state.weapon = "AWP"; this.state.cash -= 4750; }
                else if(choice == "3" && this.state.cash >= 700) { this.state.weapon = "Deagle"; this.state.cash -= 700; }
                this.updateHUD();
            },

            // КЕЙСИ (РУЛЕТКА)
            spinCase() {
                if(this.state.cash < 250) return alert("Мало грошей!");
                this.state.cash -= 250;
                this.updateHUD();

                const strip = document.getElementById('roulette-strip');
                const skins = ["AK-47 | Slate", "AWP | Dragon Lore", "Knife | Doppler", "M4A4 | Howl", "USP | Kill Confirmed"];
                strip.innerHTML = '';
                for(let i=0; i<40; i++) {
                    const el = document.createElement('div');
                    el.className = 'item-skin';
                    el.innerText = skins[Math.floor(Math.random()*skins.length)];
                    el.style.background = `hsl(${Math.random()*360}, 40%, 20%)`;
                    strip.appendChild(el);
                }
                
                strip.style.transition = "none";
                strip.style.left = "0px";
                setTimeout(() => {
                    strip.style.transition = "all 4s cubic-bezier(0.1, 0, 0.1, 1)";
                    const offset = -(35 * 100) + Math.random()*80;
                    strip.style.left = offset + "px";
                }, 50);
            },

            // 3D СВІТ
            init3D() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0b0d);
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(this.renderer.domElement);

                // Карта: Підлога та стіни
                const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({color: 0x111111}));
                floor.rotation.x = -Math.PI/2;
                this.scene.add(floor);

                this.addWall(0, 2, -10, 20, 4); // Центр
                this.addWall(10, 2, 0, 1, 10);  // Право
                
                this.scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                const sun = new THREE.PointLight(0xffffff, 1);
                sun.position.set(10, 20, 10);
                this.scene.add(sun);

                this.camera.position.set(0, 1.7, 5);
            },

            addWall(x, y, z, w, h) {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, 1), new THREE.MeshStandardMaterial({color: 0x333333}));
                wall.position.set(x, y, z);
                this.scene.add(wall);
            },

            spawnBot() {
                const b = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.4), new THREE.MeshStandardMaterial({color: 0xff4444}));
                b.add(body);
                b.position.set(Math.random()*20-10, 0.8, -Math.random()*20);
                this.scene.add(b);
                this.bots.push({obj: b, hp: 100, lastFire: 0});
            },

            start(mode) {
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('game-hud').style.display = 'block';
                document.getElementById('crosshair').style.display = 'block';
                document.getElementById('mobile-controls').style.display = 'block';
                
                this.init3D();
                if(mode === 'mp') this.initSocket();
                for(let i=0; i<5; i++) this.spawnBot();
                
                this.loop();
            },

            updateHUD() {
                document.getElementById('hp').innerText = this.state.hp;
                document.getElementById('cash').innerText = this.state.cash;
                document.getElementById('wpn-name').innerText = this.state.weapon;
            },

            loop() {
                requestAnimationFrame(() => this.loop());
                const now = Date.now();

                this.bots.forEach(bot => {
                    bot.obj.lookAt(this.camera.position.x, 0.8, this.camera.position.z);
                    // Стрільба ботів
                    if(now - bot.lastFire > 2500) {
                        const dist = bot.obj.position.distanceTo(this.camera.position);
                        if(dist < 12) {
                            this.state.hp -= 5;
                            this.updateHUD();
                        }
                        bot.lastFire = now;
                    }
                });

                this.renderer.render(this.scene, this.camera);
            }
        };

        // КЕРУВАННЯ (ДЖОЙСТИК ТА СТРІЛЬБА)
        let touchStart = { x: 0, y: 0 };
        document.getElementById('joy-move').ontouchstart = (e) => {
            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        };
        document.getElementById('joy-move').ontouchmove = (e) => {
            const dx = (e.touches[0].clientX - touchStart.x) * 0.01;
            const dy = (e.touches[0].clientY - touchStart.y) * 0.01;
            core.camera.translateZ(dy);
            core.camera.translateX(dx);
            core.camera.position.y = 1.7;
        };

        document.getElementById('fire-tap').ontouchstart = (e) => {
            e.preventDefault();
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0,0), core.camera);
            const hits = ray.intersectObjects(core.bots.map(b => b.obj), true);
            if(hits.length > 0) {
                const bObj = hits[0].object.parent;
                core.scene.remove(bObj);
                core.state.cash += 300;
                core.updateHUD();
                setTimeout(() => core.spawnBot(), 5000);
            }
        };
    </script>
</body>
</html>
